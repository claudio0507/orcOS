version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: orcos
      POSTGRES_PASSWORD: orcos
      POSTGRES_DB: orcos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orcos -d orcos"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://orcos:orcos@db:5432/orcos
      SECRET_KEY: sandbox-secret-key-change-in-production
      SANDBOX_MODE: "true"
      APP_ENV: sandbox
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://orcos:orcos@db:5432/orcos
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed_sandbox.py"
    restart: "no"

volumes:
  pg_data:

networks:
  default:
    name: orcos_sandbox_network
